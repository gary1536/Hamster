schema:
  schema_id: boshiamy
  name: 嘸蝦米
  version: "0.1"
  author: 
    - Vincent Chi <song374561@chivincent.net>
    - Yu-Cheng Chuang <ducksteven@gmail.com>
    - Yu-Cheng Huang <amoshuangyc@gmail.com>
    - 劉重次
  description:
    嘸蝦米輸入法 For RIME

switches:
  # ascii_mode、simplification、boshiamy_en_off 不設 reset：由鍵盤 App 記住上次的狀態並還原。
  # 狀態名稱會在切換時顯示在空白鍵上（librime 1.8.5 沒有 abbrev，顯示的是完整名稱）。
  - name: ascii_mode
    states: [ 中文模式, 英文模式 ]
  - name: full_shape
    states: [ 半形, 全形 ]
  - name: simplification
    states: [ 進入繁體中文模式, 進入打繁出簡模式 ]
  - name: boshiamy_en_off
    states: [ 開啟中英連打, 關閉中英連打 ]
  - name: ascii_punct
    reset: 0
    states: ["標點", "符號"]

engine:
  processors:
    # 放在最前面：先處理指令（,,T ,,CT ,,C ,,E）、空白鍵與 F35，其他按鍵一律交給後面的 processor
    - lua_processor@*boshiamy_processor   # 嘸蝦米指令（,,T ,,CT ,,C ,,E）與中英連打的空白鍵處理
    - ascii_composer
    - recognizer
    - key_binder
    - punctuator
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    # 不用 echo_translator：查不到字時不把字根碼當候選送出；按空白會清掉錯碼（見 key_binder）
    - punct_translator
    - table_translator
    - lua_translator@*boshiamy_translator  # 指令提示候選、中英連打的英文候選
  filters:
    - simplifier
    - uniquifier

menu:
  page_size: 10
  alternative_select_keys: "0123456789"


speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz,.'[]"
  max_code_length: 5
  auto_select: false

# 打繁出簡：用繁體拆碼，經 OpenCC t2s 輸出簡體。指令提示與英文候選不轉換。
simplifier:
  option_name: simplification
  opencc_config: t2s.json
  excluded_types: [ boshiamy_cmd, boshiamy_en ]

translator:
  dictionary: boshiamy
  enable_charset_filter: true # 可以把 EXT 區的漢字給過濾掉
  enable_completion: false # 不提示後續按鍵的組字結果
  enable_sentence: false # 關閉連打組句。若要啟動的話需要打開 speller/delimiter 及 enable_user_dict
  enable_user_dict: false # 取消使用者字頻調整機制。若打開的話則無法維持候選字順序。
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz,.'[]|ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺ，．’〔〕"

key_binder:
  bindings:
    - { when: always, accept: Shift+space, toggle: full_shape }
    - { when: always, accept: Control+Shift+4, toggle: simplification }
    - { when: has_menu, accept: space, send: space }
    - { when: has_menu, accept: period, send: period }
    - { when: composing, accept: space, send: Escape }

recognizer:
  import_preset: default
  patterns:
    # 大寫嘸蝦米指令（,,T ,,CT ,,C ,,E）整串當成一段，否則大寫字母會被切成另一段。
    # 小寫 ,,c 不符合（它同時是「《」的碼），照常查字。
    boshiamy_cmd: "^,,[a-zA-Z]*[A-Z][a-zA-Z]*$"
